---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./deployment.yaml
  - ./service.yaml
  - ./middleware.yaml
  - ./ingress.yaml
configMapGenerator:
  - name: glance-configmap
    namespace: glance
    files:
      - ./configs/glance.yml
generatorOptions:
  disableNameSuffixHash: true
