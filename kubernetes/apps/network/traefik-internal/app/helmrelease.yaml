---
# yaml-language-server: $schema=https://crd.movishell.pl/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app traefik-internal
  namespace: network
spec:
  interval: 30m
  chart:
    spec:
      chart: traefik
      version: "39.0.5"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 12h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    deployment:
      replicas: 1

    ingressClass:
      enabled: true
      isDefaultClass: false
      name: internal

    ingressRoute:
      dashboard:
        enabled: false

    service:
      enabled: true
      type: LoadBalancer
      spec:
        externalTrafficPolicy: Cluster
      annotations:
        metallb.universe.tf/loadBalancerIPs: ""

    ports:
      web:
        port: 80
        expose:
          default: true
        exposedPort: 80
      websecure:
        port: 443
        expose:
          default: true
        exposedPort: 443
        http:
          tls:
            enabled: true
      traefik:
        port: 9000
        expose:
          default: false
        exposedPort: 9000
      metrics:
        port: 9100
        expose:
          default: false
        exposedPort: 9100

    metrics:
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true

    logs:
      general:
        level: INFO
      access:
        enabled: true

    providers:
      kubernetesCRD:
        enabled: true
        allowCrossNamespace: true
        ingressClass: internal
      kubernetesIngress:
        enabled: true
        allowExternalNameServices: true
        ingressClass: internal
        publishedService:
          enabled: true

    additionalArguments:
      - "--api.dashboard=true"
      - "--api.insecure=false"
      - "--serverstransport.insecureskipverify=true"
