---
# yaml-language-server: $schema=https://crd.movishell.pl/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pihole
  namespace: network
spec:
  interval: 30m
  chart:
    spec:
      chart: pihole
      version: 2.39.0
      sourceRef:
        kind: HelmRepository
        name: mojo2600
        namespace: flux-system
  values:
    image:
      tag: "2026.11.0"

    DNS1: "127.0.0.1#5053"

    doh:
      enabled: true
      config: |
        server_names = ['quad9-doh-ip4-port443-filter-pri', 'cloudflare']
        lb_strategy = 'first'
        listen_addresses = ['0.0.0.0:5053']
        require_dnssec = false
        require_nolog = true
        require_nofilter = true
        dnscrypt_servers = true
        doh_servers = true
        odoh_servers = false
        ipv6_servers = false
        bootstrap_resolvers = ['9.9.9.9:53', '1.1.1.1:53']
        timeout = 5000
        keepalive = 30
        log_level = 2
        use_syslog = false
        cache = true
        cache_size = 4096
        cache_min_ttl = 2400
        cache_max_ttl = 86400
        cache_neg_min_ttl = 60
        cache_neg_max_ttl = 600

        [sources]
          [sources.'public-resolvers']
            urls = [
              'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/public-resolvers.md',
              'https://download.dnscrypt.info/resolvers-list/v3/public-resolvers.md'
            ]
            cache_file = '/tmp/public-resolvers.md'
            minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
            refresh_delay = 73
          [sources.'relays']
            urls = [
              'https://raw.githubusercontent.com/DNSCrypt/dnscrypt-resolvers/master/v3/relays.md',
              'https://download.dnscrypt.info/resolvers-list/v3/relays.md'
            ]
            cache_file = '/tmp/relays.md'
            minisign_key = 'RWQf6LRCGA9i53mlYecO4IzT51TGPpvWucNSCh1CBM0QTaLn73Y7GFO3'
            refresh_delay = 73

    persistentVolumeClaim:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: "1Gi"
      storageClass: "longhorn"

    ingress:
      enabled: true
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-production
      ingressClassName: internal
      hosts:
        - pihole.${SECRET_INTERNAL_DOMAIN}
      tls:
        - secretName: pihole-tls
          hosts:
            - pihole.${SECRET_INTERNAL_DOMAIN}

    extraEnvVars:
      FTLCONF_webserver_port: "80"
      FTLCONF_dns_dnssec: "true"
      FTLCONF_dns_interface: "eth0"
      FTLCONF_dns_listeningMode: "all"

    serviceWeb:
      loadBalancerIP: 10.0.10.200
      annotations:
        metallb.io/allow-shared-ip: pihole-svc
      type: LoadBalancer

    serviceDns:
      loadBalancerIP: 10.0.10.200
      annotations:
        metallb.io/allow-shared-ip: pihole-svc
      type: LoadBalancer

    replicaCount: 1

    nodeSelector:
      kubernetes.io/hostname: talos-worker-eu-02
